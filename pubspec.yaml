name: stock_management_system
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  reactive_forms: ^17.0.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  flutter_staggered_animations: ^1.0.0
  lottie: ^3.1.0
  pull_to_refresh: ^2.0.0
  dio: ^5.4.3+1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  syncfusion_flutter_pdfviewer: ^33.2.4
  dropdown_button2: ^3.1.0
  pdf: ^3.12.0
  excel: ^4.0.6
  printing: ^5.14.3
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icons/icons8-app-96.png"
  image_path: "assets/icons/icons8-app-96.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
